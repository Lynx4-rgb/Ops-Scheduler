  document.getElementById('modal-root').innerHTML = html;
}

function writeSpanBlock(dateStr, slotKey, minutes, data){
  const d = ensureDaily(dateStr);
  const parts = slotKey.split('_');
  const h = parseInt(parts[0].slice(1));
  const m = parseInt(parts[1]);
  const keys = spanKeysFrom(h, m, minutes);
  const startKey = keys[0];
  d.slots[startKey] = Object.assign({completed:false, span:keys.length}, data);
  keys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:startKey}; });
}

function parseSlotKey(key){
  const p = key.split('_');
  return {h:parseInt(p[0].slice(1)), m:parseInt(p[1])};
}

function checkConflict(dateStr, startKey, minutes){
  const d = ensureDaily(dateStr);
  const {h,m} = parseSlotKey(startKey);
  const keys = spanKeysFrom(h,m,minutes);
  for(let i=0;i<keys.length;i++){
    const k = keys[i];
    if(d.slots[k]){
      let conflictPrimaryKey = k;
      let conflictSlot = d.slots[k];
      if(conflictSlot.occupiedBy){ conflictPrimaryKey = conflictSlot.occupiedBy; conflictSlot = d.slots[conflictPrimaryKey]; }
      return {maxFitMinutes:i*15, conflictPrimaryKey, conflictSlot};
    }
  }
  return null;
}

function shiftBlockLater(dateStr, primaryKey, shiftMinutes){
  const d = ensureDaily(dateStr);
  const slot = d.slots[primaryKey];
  if(!slot) return false;
  const {h,m} = parseSlotKey(primaryKey);
  const duration = (slot.span||1)*15;
  const allQ = quarters();
  const oldIdx = allQ.findIndex(q=>q.h===h && q.m===m);
  const shiftQuarters = Math.round(shiftMinutes/15);
  const newIdx = oldIdx + shiftQuarters;
  const neededQuarters = Math.round(duration/15);
  if(newIdx<0 || newIdx+neededQuarters>allQ.length) return false;
  const newStart = allQ[newIdx];
  const newKeys = spanKeysFrom(newStart.h, newStart.m, duration);
  if(newKeys.length < neededQuarters) return false;
  const oldKeys = spanKeysFrom(h, m, duration);
  for(const k of newKeys){
    if(oldKeys.includes(k)) continue;
    if(d.slots[k]) return false;
  }
  oldKeys.forEach(k=>{ delete d.slots[k]; });
  const newPrimary = newKeys[0];
  d.slots[newPrimary] = Object.assign({}, slot, {span:newKeys.length});
  newKeys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:newPrimary}; });
  return true;
}

function attemptAssign(dateStr, startKey, minutes, data){
  const conflict = checkConflict(dateStr, startKey, minutes);
  if(!conflict){
    writeSpanBlock(dateStr, startKey, minutes, data);
    saveState(); closeModal(); renderDaily();
    return;
  }
  window._pendingAssign = {dateStr, startKey, minutes, data, conflict};
  showConflictModal();
}

function showConflictModal(){
  const {minutes, conflict} = window._pendingAssign;
  const cs = conflict.conflictSlot;
  let conflictName = 'existing item';
  if(cs.critical) conflictName = cs.name;
  else if(cs.taskId){ const t = state.tasks.find(x=>x.id===cs.taskId) || state.archive.find(x=>x.id===cs.taskId); if(t) conflictName = t.name; }
  else if(cs.customText) conflictName = cs.customText;
  const overlap = minutes - conflict.maxFitMinutes;
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal">
      <h2>⚠ Time Conflict</h2>
      <p>This ${minutes}-minute task overlaps "${escHtml(conflictName)}" already on the schedule. Choose how to resolve it:</p>
      <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px;">
        ${conflict.maxFitMinutes>0?`<button class="btn btn-accent" onclick="resolveConflictReduce()">Reduce this task to ${conflict.maxFitMinutes} min</button>`:''}
        <button class="btn btn-accent" onclick="resolveConflictShift()">Push "${escHtml(conflictName)}" later by ${overlap} min</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`;
}
function resolveConflictReduce(){
  const p = window._pendingAssign;
  writeSpanBlock(p.dateStr, p.startKey, p.conflict.maxFitMinutes, p.data);
  saveState(); closeModal(); renderDaily();
}
function resolveConflictShift(){
  const p = window._pendingAssign;
  const overlap = p.minutes - p.conflict.maxFitMinutes;
  const ok = shiftBlockLater(p.dateStr, p.conflict.conflictPrimaryKey, overlap);
  if(!ok){
    showNotice('Cannot Shift', "There isn't enough free room after the conflicting task to push it back. Try reducing your new task instead, or move things manually.");
    return;
  }
  writeSpanBlock(p.dateStr, p.startKey, p.minutes, p.data);
  saveState(); closeModal(); renderDaily();
}

function stepCritTime(delta){
  const inp = document.getElementById('crit-time');
  if(!inp) return;
  let v = (parseInt(inp.value)||30) + delta;
  inp.value = Math.max(5, v);
}

function assignTaskToSlot(dateStr, slotKey, taskId){
  const task = state.tasks.find(t=>t.id===taskId);
  const minutes = task ? task.time : 15;
  attemptAssign(dateStr, slotKey, minutes, {taskId});
}
function assignCustomToSlot(dateStr, slotKey){
  const val = document.getElementById('custom-slot-text').value.trim();
  const minutes = parseInt(document.getElementById('custom-slot-time').value)||15;
  if(!val) return;
  attemptAssign(dateStr, slotKey, minutes, {customText:val});
}
function createCriticalTask(dateStr, slotKey){
  const name = document.getElementById('crit-name').value.trim();
  const time = parseInt(document.getElementById('crit-time').value)||30;
  if(!name) return;
  attemptAssign(dateStr, slotKey, time, {critical:true, name, time});
}

function confirmClearDay(dateStr){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>Clear Day?</h2>
      <p>This removes your own tasks and Outlook items from ${fmtDMY(dateStr)}. Fixed blocks (Morning Routine, Travel/Workout, Dinner, Meeting) stay put. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-small" onclick="closeModal()">Cancel</button>
        <button class="btn btn-red btn-small" onclick="clearDay('${dateStr}')">Clear Day</button>
      </div>
    </div>
  </div>`;
}
function clearDay(dateStr){
  const d = ensureDaily(dateStr);
  Object.keys(d.slots).forEach(k=>{
    const s = d.slots[k];
    if(!s) return;
    if(s.source==='default') return; // keep fixed blocks
    if(s.occupiedBy){
      const primary = d.slots[s.occupiedBy];
      if(primary && primary.source==='default') return; // keep continuation of a fixed block
      delete d.slots[k];
      return;
    }
    delete d.slots[k];
  });
  saveState(); closeModal(); renderDaily();
  showToast('Day cleared');
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---- drag & drop (long-press on touch, click-drag on desktop) ---- */
function startTaskDrag(ev, dateStr, slotKey){
  if(window._dragState) return;
  const startX = ev.clientX, startY = ev.clientY;
  const ds = {dateStr, slotKey, startX, startY, dragging:false, timer:null};
  window._dragState = ds;
  ds.timer = setTimeout(()=>{
    ds.dragging = true;
    const el = ev.target.closest('.task-box');
    if(el) el.classList.add('being-dragged');
  }, 300);
  document.addEventListener('pointermove', onDragPointerMove);
  document.addEventListener('pointerup', onDragPointerUp, {once:true});
}
function onDragPointerMove(ev){
  const ds = window._dragState;
  if(!ds) return;
  if(!ds.dragging){
    const dx = Math.abs(ev.clientX-ds.startX), dy = Math.abs(ev.clientY-ds.startY);
    if(dx>12 || dy>12){
      clearTimeout(ds.timer);
      window._dragState = null;
      document.removeEventListener('pointermove', onDragPointerMove);
    }
    return;
  }
  ev.preventDefault();
  document.querySelectorAll('.drop-target-hover').forEach(el=>el.classList.remove('drop-target-hover'));
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const target = el && el.closest('[data-slotkey]');
  if(target) target.classList.add('drop-target-hover');
}
function onDragPointerUp(ev){
  document.removeEventListener('pointermove', onDragPointerMove);
  const ds = window._dragState;
  window._dragState = null;
  if(!ds) return;
  clearTimeout(ds.timer);
  document.querySelectorAll('.being-dragged').forEach(el=>el.classList.remove('being-dragged'));
  document.querySelectorAll('.drop-target-hover').forEach(el=>el.classList.remove('drop-target-hover'));
  if(!ds.dragging) return;
  window._justDragged = true;
  setTimeout(()=>{ window._justDragged = false; }, 80);
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const target = el && el.closest('[data-slotkey]');
  if(target){
    const toKey = target.getAttribute('data-slotkey');
    const toDate = target.getAttribute('data-datestr');
    if(toDate===ds.dateStr && toKey!==ds.slotKey) trySwapOrMove(ds.dateStr, ds.slotKey, toKey);
  }
}
function stripMeta(slot){
  const clone = Object.assign({}, slot);
  delete clone.completed; delete clone.span; delete clone.occupiedBy;
  return clone;
}
function trySwapOrMove(dateStr, fromKeyRaw, toKeyRaw){
  const d = ensureDaily(dateStr);
  let fromKey = fromKeyRaw;
  let from = d.slots[fromKey];
  if(from && from.occupiedBy){ fromKey = from.occupiedBy; from = d.slots[fromKey]; }
  if(!from) return;
  if(from.source==='weeklygoal' || from.source==='default'){
    showNotice('Cannot Move', "This item is fixed by your Weekly Schedule or daily routine and can't be dragged.");
    return;
  }
  let toKey = toKeyRaw;
  let to = d.slots[toKey];
  if(to && to.occupiedBy){ toKey = to.occupiedBy; to = d.slots[toKey]; }
  if(toKey===fromKey) return;
  if(to && (to.source==='weeklygoal' || to.source==='default')){
    showNotice('Cannot Move', "That slot is fixed and can't be swapped into.");
    return;
  }

  const fromMinutes = (from.span||1)*15;
  const fromParts = parseSlotKey(fromKey);
  const fromSpanKeys = spanKeysFrom(fromParts.h, fromParts.m, fromMinutes);

  if(!to){
    fromSpanKeys.forEach(k=>delete d.slots[k]);
    const conflict = checkConflict(dateStr, toKey, fromMinutes);
    if(conflict){
      d.slots[fromKey] = from;
      fromSpanKeys.slice(1).forEach(k=>{ d.slots[k] = {occupiedBy:fromKey}; });
      showNotice('Cannot Move', "That slot doesn't have enough free room. Try a different spot.");
      renderDaily();
      return;
    }
    writeSpanBlock(dateStr, toKey, fromMinutes, stripMeta(from));
  } else {
    const toMinutes = (to.span||1)*15;
    const toParts = parseSlotKey(toKey);
    const toSpanKeys = spanKeysFrom(toParts.h, toParts.m, toMinutes);
    fromSpanKeys.forEach(k=>delete d.slots[k]);
    toSpanKeys.forEach(k=>delete d.slots[k]);
    writeSpanBlock(dateStr, toKey, fromMinutes, stripMeta(from));
    writeSpanBlock(dateStr, fromKey, toMinutes, stripMeta(to));
  }
  saveState(); renderDaily();
}
function showNotice(title, message){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>${escHtml(title)}</h2>
      <p>${escHtml(message)}</p>
      <div class="modal-actions"><button class="btn btn-accent btn-small" onclick="closeModal()">OK</button></div>
    </div>
  </div>`;
}

function autoFillDay(dateStr){
  const d = ensureDaily(dateStr);
  const dayIdx = new Date(dateStr+'T00:00:00').getDay();
  const usedIds = new Set(Object.values(d.slots).filter(s=>s && s.taskId).map(s=>s.taskId));
  let pool = state.tasks.filter(t=>!usedIds.has(t.id));
  const today0 = new Date(); today0.setHours(0,0,0,0);
  pool.sort((a,b)=>{
    const aOverdue = a.dueDate && new Date(a.dueDate+'T00:00:00') < today0;
    const bOverdue = b.dueDate && new Date(b.dueDate+'T00:00:00') < today0;
    if(aOverdue !== bOverdue) return aOverdue ? -1 : 1;
    const pa=computePriority(a), pb=computePriority(b);
    if(PRI_RANK[pa]!==PRI_RANK[pb]) return PRI_RANK[pa]-PRI_RANK[pb];
    return new Date(a.dueDate||'2099-01-01') - new Date(b.dueDate||'2099-01-01');
  });
  const allQ = quarters();
  let placedCount = 0;
  pool.forEach(task=>{
    const needed = Math.max(1, Math.round(task.time/15));
    for(let i=0;i<allQ.length;i++){
      const startQ = allQ[i];
      if(d.slots[startQ.key]) continue;
      let ok = true;
      for(let j=0;j<needed;j++){
        const idx = i+j;
        if(idx>=allQ.length){ ok=false; break; }
        const q = allQ[idx];
        if(d.slots[q.key]){ ok=false; break; }
        const wtConstraint = getWorkTypeConstraint(q.h, q.m);
        if(wtConstraint && task.workType && task.workType!=='General' && wtConstraint!==task.workType){ ok=false; break; }
      }
      if(ok){
        writeSpanBlock(dateStr, startQ.key, task.time, {taskId:task.id});
        placedCount++;
        break;
      }
    }
  });
  saveState(); renderDaily();
  if(placedCount===0){
    showNotice('Auto Fill', 'No empty slots matched your remaining tasks by category and duration. Try widening some Weekly Orders time blocks to Open (blank), or free up more of the day.');
  }
}

/* ================= OUTLOOK SYNC =================
   Uses the in-artifact Anthropic API + Microsoft 365 MCP connector.
   Only works while this app is open inside Claude.ai with the
   Microsoft 365 connector enabled for this chat — a standalone
   downloaded copy of this file cannot reach it. */
const OUTLOOK_AUTO_KEYWORDS = {
  'Learning':['learning'],
  'OOS Lines / PSOs':['oos','pso'],
  'Unconfirmed':['unconfirmed'],
  'Overdue':['overdue'],
  'Meeting':['meeting','call','sync','1:1','catch up','catchup','standup','review'],
  'Purchasing run':['purchasing run','purchasing'],
  'Tomorrow plan':['tomorrow plan'],
  'Lunch':['lunch'],
  'Personal Inbox':['personal inbox']
};
function isOutlookAutoCategory(ev){
  const cat = String(ev.category||'').toLowerCase();
  const title = String(ev.title||'').toLowerCase();
  for(const [bucket, kws] of Object.entries(OUTLOOK_AUTO_KEYWORDS)){
    if(kws.some(k=> cat.includes(k) || title.includes(k))) return bucket;
  }
  return null;
}

function outlookSyncMode(){
  if(state.settings && state.settings.githubRepo) return 'github-file';
  if(state.settings && state.settings.msClientId) return 'graph';
  if(window.storage) return 'claude-mcp';
  return 'none';
}

async function syncOutlook(dateStr, opts){
  opts = opts || {};
  const mode = outlookSyncMode();
  if(mode==='github-file') return syncOutlookViaGithubFile(dateStr, opts);
  if(mode==='graph') return syncOutlookViaGraph(dateStr, opts);
  if(mode==='claude-mcp') return syncOutlookViaClaudeMcp(dateStr, opts);
  if(opts.hideLoadingAfter) hideLoadingProgressModal();
  if(!opts.silent){
    showNotice('Outlook Not Connected', 'Set up Outlook sync in Settings to enable calendar pull-through.');
  }
}

/* ---------------- Sync via a GitHub-hosted JSON file ----------------
   A Claude Cowork scheduled task writes tomorrow's Outlook events to
   outlook-events.json in your repo each weekday afternoon. This just
   reads that file — no OAuth, no Azure, works identically everywhere. */
async function syncOutlookViaGithubFile(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  try{
    const repo = (state.settings.githubRepo||'').trim().replace(/^\/|\/$/g,'');
    if(!repo) throw new Error('No GitHub repo set in Settings.');
    const url = `https://raw.githubusercontent.com/${repo}/main/outlook-events.json?t=${Date.now()}`;
    const resp = await fetch(url, {cache:'no-store'});
    if(!resp.ok) throw new Error('Could not fetch outlook-events.json (HTTP '+resp.status+'). Has the scheduled task run yet?');
    const raw = await resp.json();
    let events, fileDate;
    if(Array.isArray(raw)){ events = raw; fileDate = null; }
    else { events = raw.events || []; fileDate = raw.date || null; }
    if(fileDate && fileDate !== dateStr){
      if(opts.hideLoadingAfter) hideLoadingProgressModal();
      if(!opts.silent) closeModal();
      showNotice('Outlook Data Out of Date', `The GitHub file is dated ${fmtDMY(fileDate)}, not ${fmtDMY(dateStr)}. The scheduled task may not have run yet for this day — check your Cowork scheduled task.`);
      return;
    }
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice('Outlook Sync Failed', "Couldn't read the calendar file from GitHub: "+e.message);
    }
  }
}

/* ---------------- Direct Microsoft Graph sync (works standalone, e.g. on GitHub Pages) ----------------
   Uses Microsoft's own MSAL.js library to sign in from the browser and read
   the user's calendar directly via Microsoft Graph — no backend, no Anthropic
   API involved. Requires a one-time Azure App Registration (see Settings). */
let _msalInstance = null;
function ensureMsalLoaded(){
  return new Promise((resolve, reject)=>{
    if(window.msal){ resolve(window.msal); return; }
    const script = document.createElement('script');
    script.src = 'https://alcdn.msauth.net/browser/3.7.1/js/msal-browser.min.js';
    script.onload = ()=>resolve(window.msal);
    script.onerror = ()=>reject(new Error('Could not load the Microsoft sign-in library.'));
    document.head.appendChild(script);
  });
}
function getMsalInstance(){
  if(_msalInstance) return _msalInstance;
  if(!state.settings.msClientId) throw new Error('No Microsoft Client ID set in Settings.');
  _msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: state.settings.msClientId,
      authority: 'https://login.microsoftonline.com/common',
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: 'localStorage' }
  });
  return _msalInstance;
}
async function connectOutlookGraph(){
  try{
    await ensureMsalLoaded();
    const instance = getMsalInstance();
    const resp = await instance.loginPopup({scopes:['Calendars.Read']});
    instance.setActiveAccount(resp.account);
    saveState();
    closeModal(); openSettingsModal();
    showToast('Connected to Outlook');
  }catch(e){
    showNotice('Connection Failed', e.message);
  }
}
function disconnectOutlookGraph(){
  if(_msalInstance){
    const account = _msalInstance.getActiveAccount();
    if(account) _msalInstance.logoutPopup({account}).catch(()=>{});
  }
  _msalInstance = null;
  closeModal(); openSettingsModal();
}
function isOutlookGraphConnected(){
  try{
    if(!state.settings.msClientId || !window.msal) return false;
    const instance = getMsalInstance();
    return instance.getAllAccounts().length > 0;
  }catch(e){ return false; }
}
async function acquireGraphToken(){
  await ensureMsalLoaded();
  const instance = getMsalInstance();
  let account = instance.getActiveAccount();
  if(!account){
    const accounts = instance.getAllAccounts();
    if(accounts.length>0){ account = accounts[0]; instance.setActiveAccount(account); }
  }
  if(!account){
    const resp = await instance.loginPopup({scopes:['Calendars.Read']});
    instance.setActiveAccount(resp.account);
    account = resp.account;
  }
  try{
    const resp = await instance.acquireTokenSilent({scopes:['Calendars.Read'], account});
    return resp.accessToken;
  }catch(e){
    const resp = await instance.acquireTokenPopup({scopes:['Calendars.Read']});
    return resp.accessToken;
  }
}
async function fetchGraphEvents(dateStr){
  const token = await acquireGraphToken();
  const start = dateStr+'T00:00:00';
  const endD = new Date(dateStr+'T00:00:00'); endD.setDate(endD.getDate()+1);
  const end = endD.getFullYear()+'-'+String(endD.getMonth()+1).padStart(2,'0')+'-'+String(endD.getDate()).padStart(2,'0')+'T00:00:00';
  const url = `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start}&endDateTime=${end}&$select=subject,start,end&$orderby=start/dateTime`;
  const resp = await fetch(url, { headers: { Authorization: 'Bearer '+token, Prefer: 'outlook.timezone="UTC"' } });
  if(!resp.ok) throw new Error('Microsoft Graph returned an error (HTTP '+resp.status+').');
  const data = await resp.json();
  return (data.value||[]).map(ev=>{
    const s = new Date(ev.start.dateTime+'Z');
    const e = new Date(ev.end.dateTime+'Z');
    return {
      title: ev.subject || '(no title)',
      start: String(s.getHours()).padStart(2,'0')+':'+String(s.getMinutes()).padStart(2,'0'),
      end: String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0'),
      category: ''
    };
  });
}
async function syncOutlookViaGraph(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  try{
    const events = await fetchGraphEvents(dateStr);
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice('Outlook Sync Failed', "Couldn't reach Outlook: "+e.message+' Try reconnecting in Settings.');
    }
  }
}

async function syncOutlookViaClaudeMcp(dateStr, opts){
  opts = opts || {};
  if(!opts.silent) showSyncingModal();
  const prompt = `You have access to the user's Outlook calendar via Microsoft 365 tools. Look up all calendar events for ${dateStr} (YYYY-MM-DD). For each event, classify it into exactly one of these categories based on its title/context: "Learning", "OOS Lines / PSOs", "Unconfirmed", "Overdue", "Meeting" (any meeting invite), "Purchasing run", "Tomorrow plan", "Lunch", "Personal Inbox", or "Other" if none clearly match. Respond with ONLY a raw JSON array, no markdown fences, no commentary: [{"title":string,"start":"HH:MM" (24hr),"end":"HH:MM" (24hr),"category":string}]. If there are no events, respond with [].`;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{role:"user", content: prompt}],
        mcp_servers: [{type:"url", url:"https://microsoft365.mcp.claude.com/mcp", name:"microsoft365"}]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    let events = [];
    try{ events = JSON.parse(clean); }
    catch(e){
      if(opts.hideLoadingAfter) hideLoadingProgressModal();
      if(!opts.silent){
        closeModal();
        showNotice("Outlook Sync", "Couldn't read a clean response from Outlook sync. Make sure the Microsoft 365 connector is enabled for this chat (Settings > Connectors), and note this only works while the app is open inside Claude.ai.");
      }
      return;
    }
    processOutlookEvents(dateStr, events, opts);
  }catch(e){
    if(opts.hideLoadingAfter) hideLoadingProgressModal();
    if(!opts.silent){
      closeModal();
      showNotice("Outlook Sync Failed", "Outlook sync failed: "+e.message+". This only works while the app is open inside Claude.ai with Microsoft 365 connected — it can't reach Outlook from a standalone downloaded file.");
    }
  }
}

function showLoadingProgressModal(title){
  const estimatedMs = 8000; // expected total sync time — bar moves at a constant pace toward this
  const startTime = Date.now();
  window._loadingModalActive = true;
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal" style="text-align:center;">
      <h2>${escHtml(title||'Loading')}</h2>
      <div id="loading-donut-holder">${renderDonut(0,'var(--amber)','Syncing')}</div>
      <p class="assumption-note">Pulling Outlook calendar events and Weekly Schedule goals...</p>
    </div>
  </div>`;
  clearInterval(window._loadingAnimInterval);
  clearTimeout(window._loadingSafetyTimeout);
  window._loadingAnimInterval = setInterval(()=>{
    const elapsed = Date.now() - startTime;
    const pct = Math.min(92, (elapsed/estimatedMs)*92);
    const holder = document.getElementById('loading-donut-holder');
    if(holder) holder.innerHTML = renderDonut(Math.round(pct), 'var(--amber)', 'Syncing');
    else clearInterval(window._loadingAnimInterval);
  }, 100);
  // safety net: if the sync call hangs or never calls back for any reason (slow network,
  // connector not available, etc.), force the bar to finish rather than leaving it stuck
  window._loadingSafetyTimeout = setTimeout(()=>{
    if(window._loadingModalActive) hideLoadingProgressModal();
  }, 12000);
}
function hideLoadingProgressModal(){
  window._loadingModalActive = false;
  clearTimeout(window._loadingSafetyTimeout);
  clearInterval(window._loadingAnimInterval);
  const holder = document.getElementById('loading-donut-holder');
  if(!holder) return; // modal-root has already been taken over by something else — don't touch it
  let current = 92;
  const finishInterval = setInterval(()=>{
    const h = document.getElementById('loading-donut-holder');
    if(!h){ clearInterval(finishInterval); return; } // bail if something else replaced the modal mid-animation
    current = Math.min(100, current+2);
    h.innerHTML = renderDonut(current, current>=100?'var(--comp-100)':'var(--amber)', current>=100?'Done! 🥇':'Syncing');
    if(current>=100){
      clearInterval(finishInterval);
      setTimeout(()=>{
        const stillThere = document.getElementById('loading-donut-holder');
        if(stillThere) closeModal(); // only close if we're still the modal on screen
      }, 450);
    }
  }, 30);
}

function showSyncingModal(){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back"><div class="modal"><h2>📅 Syncing Outlook…</h2><p>Reading your calendar and matching recurring items. This can take a few seconds.</p></div></div>`;
}

function processOutlookEvents(dateStr, events, opts){
  opts = opts || {};
  const d = ensureDaily(dateStr);
  let autoAdded = 0;
  const flagged = [];
  (events||[]).forEach(ev=>{
    if(!ev || !ev.title || !ev.start) return;
    const matchedBucket = isOutlookAutoCategory(ev);
    const isAuto = !!matchedBucket;
    const parts0 = ev.start.split(':').map(Number);
    const sh=parts0[0], sm=parts0[1]||0;
    let minutes = 30;
    if(ev.end){
      const parts1 = ev.end.split(':').map(Number);
      minutes = Math.max(15, (parts1[0]*60+(parts1[1]||0)) - (sh*60+sm));
    }
    let snapM = Math.round(sm/15)*15, snapH = sh;
    if(snapM===60){ snapM=0; snapH++; }
    if(snapH<4 || snapH>21){ if(!isAuto) flagged.push(ev); return; }
    if(isAuto){
      const key = 'q'+snapH+'_'+snapM;
      if(!d.slots[key]){
        const data = {customText: ev.title, source:'outlook'};
        if(matchedBucket==='Meeting') data.noDone = true;
        writeSpanBlock(dateStr, key, minutes, data);
        autoAdded++;
      }
    } else {
      flagged.push(ev);
    }
  });
  saveState();
  if(opts.hideLoadingAfter) hideLoadingProgressModal();
  if(flagged.length>0){
    showFlaggedEventsModal(dateStr, flagged, autoAdded);
  } else {
    if(!opts.silent){ closeModal(); showNotice('Outlook Sync', autoAdded+' item(s) auto-scheduled from Outlook.'); }
    renderDaily();
  }
}

function showFlaggedEventsModal(dateStr, flagged, autoAdded){
  window._flaggedEvents = flagged;
  let html = `<div class="modal-back">
    <div class="modal">
      <h2>Other Calendar Items</h2>
      <p>${autoAdded} recurring item(s) auto-scheduled. These others don't match your auto-schedule list — want them added too?</p>
      <div class="suggest-list">`;
  flagged.forEach((ev,i)=>{
    html += `<div class="flag-item">
      <div><div class="fname">You have "${escHtml(ev.title)}" at ${escHtml(ev.start||'')}${ev.end?'–'+escHtml(ev.end):''}</div><div class="fmeta">${escHtml(ev.category||'Other')} — schedule it in?</div></div>
      <div class="fbtns">
        <button class="btn btn-small btn-accent" onclick="addFlaggedEvent('${dateStr}',${i});removeFlagItemAndCheck(this);">Yes</button>
        <button class="btn btn-small btn-ghost" onclick="removeFlagItemAndCheck(this)">No</button>
      </div>
    </div>`;
  });
  html += `</div>
      <div class="modal-actions"><button class="btn" onclick="closeModal();renderDaily();">Done</button></div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

function removeFlagItemAndCheck(btn){
  const item = btn.closest('.flag-item');
  const list = btn.closest('.suggest-list');
  if(item) item.remove();
  if(list && list.querySelectorAll('.flag-item').length===0){
    closeModal();
    renderDaily();
  }
}
function addFlaggedEvent(dateStr, i){
  const ev = window._flaggedEvents[i];
  if(!ev) return;
  const parts0 = ev.start.split(':').map(Number);
  const sh=parts0[0], sm=parts0[1]||0;
  let minutes=30;
  if(ev.end){ const parts1=ev.end.split(':').map(Number); minutes=Math.max(15,(parts1[0]*60+(parts1[1]||0))-(sh*60+sm)); }
  let snapM = Math.round(sm/15)*15, snapH=sh;
  if(snapM===60){ snapM=0; snapH++; }
  if(snapH>=4 && snapH<=21){
    const d = ensureDaily(dateStr);
    const key = 'q'+snapH+'_'+snapM;
    if(!d.slots[key]){ writeSpanBlock(dateStr, key, minutes, {customText: ev.title, source:'outlook'}); saveState(); }
  }
}

        <div class="row-actions">
          <div class="done-box" onclick="completeTask('${t.id}')">Done</div>
          <div class="edit-icon" title="Edit task" onclick="openEditTaskModal('${t.id}')">✎</div>
          <div class="del-strip" title="Delete permanently" onclick="confirmDeleteTask('${t.id}')">✕</div>
        </div>
      </td>
    </tr>`;
  });
  html += `</table></div>`;
  panel.innerHTML = html;
}

function startInlineEdit(id, field){
  state._inlineEdit = {id, field};
  renderRoster();
}
function cancelInlineEditBlur(){
  setTimeout(()=>{
    if(state._inlineEdit){ state._inlineEdit = null; renderRoster(); }
  }, 150);
}
function saveInlineEdit(id, field, value){
  const t = state.tasks.find(x=>x.id===id);
  if(!t){ state._inlineEdit=null; renderRoster(); return; }
  if(field==='category') t.category = value;
  else if(field==='workType') t.workType = value;
  else if(field==='time') t.time = parseInt(value)||t.time;
  else if(field==='dueDate'){
    const due = value || null;
    const v = validatePriorityDate(t.priority, due);
    if(!v.ok){
      state._inlineEdit = null;
      window._pendingTaskEdit = {id:t.id, name:t.name, cat:t.category, wt:t.workType, pri:t.priority, time:t.time, due, multi:t.multiStep};
      showPriorityDateConflictModal(v, 'edit');
      return;
    }
    t.dueDate = due;
  }
  state._inlineEdit = null;
  saveState(); renderRoster();
}

function setDraftPriority(p){
  newTaskDraft.priority = p;
  const row = document.getElementById('new-task-pri-row');
  if(row) row.querySelectorAll('.pri-opt').forEach(el=>el.classList.toggle('active', el.dataset.val===p));

    hiddenEl.value = iso;

function setDraftWorkType(wt){

  if(row) row.querySelectorAll('.wt-opt').forEach(el=>el.classList.toggle('active', el.dataset.val===wt));
}

function addTask(){
  const name = document.getElementById('new-task-name').value.trim();
  const cat = document.getElementById('new-task-cat').value;
  const time = parseInt(document.getElementById('new-task-time').value)||15;
  const multi = document.getElementById('new-task-multi').checked;
  const pri = newTaskDraft.priority;
  const wt = newTaskDraft.workType;
  if(!name) return;
  let due = document.getElementById('new-task-due-hidden').value || null;
  if(!due){
    const today = new Date();
    const d = new Date(today.getTime() + priorityDueOffset(pri)*86400000);
    due = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  const v = validatePriorityDate(pri, due);
  if(!v.ok){
    window._pendingTaskAdd = {name, cat, wt, time, due, multi, pri};
    showPriorityDateConflictModal(v, 'add');
    return;
  }
  finalizeAddTask({name, cat, wt, time, due, multi, pri});
}
function finalizeAddTask(data){
  state.tasks.push({ id:uid(), name:data.name, category:data.cat, workType:data.wt, time:data.time, multiStep:data.multi, dueDate:data.due, priority:data.pri, created:todayISO() });
  newTaskDraft = {time:data.time, priority:data.pri, category:data.cat, workType:data.wt, multiStep:false, due:data.due};
  saveState(); renderRoster();
  showToast('Task added to list');
}
function showPriorityDateConflictModal(v, mode){
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal">
      <h2>⚠ Priority / Due Date Mismatch</h2>
      <p>That due date is ${v.enteredDays} day(s) out, which fits Priority <span class="badge badge-${v.correctTier}">${v.correctTier}</span> — not the priority you picked.</p>
      <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px;">
        <button class="btn btn-accent" onclick="resolvePriConflict('${mode}','priority','${v.correctTier}')">Use Priority <span class="badge badge-${v.correctTier}" style="margin-left:6px;">${v.correctTier}</span> instead</button>
        <button class="btn btn-accent" onclick="resolvePriConflict('${mode}','date','${v.suggestedDate}')">Use ${fmtDMY(v.suggestedDate)} instead</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`;
}
function resolvePriConflict(mode, field, value){
  const pending = mode==='add' ? window._pendingTaskAdd : window._pendingTaskEdit;
  if(!pending) return;
  if(field==='priority') pending.pri = value; else pending.due = value;
  closeModal();
  if(mode==='add') finalizeAddTask(pending); else finalizeEditTask(pending);
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast-notice';
  t.textContent = '✓ '+msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add('toast-out'); setTimeout(()=>t.remove(), 300); }, 1800);
}

function completeTask(id){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const task = state.tasks[idx];
  task.completedDate = todayISO();
  state.archive.push(task);
  state.tasks.splice(idx,1);
  Object.values(state.daily).forEach(d=>{
    Object.values(d.slots||{}).forEach(s=>{ if(s.taskId===id) s.completed=true; });
  });
  saveState();
  if(task.multiStep){ setTimeout(()=>promptFollowUp(task), 50); }
  renderAll();
}

/* ================= CHARTS ================= */
const CAT_COLOR_VAR = {Self:'var(--cat-self)', Purchasing:'var(--cat-purchasing)', Ezystor:'var(--cat-ezystor)', Family:'var(--cat-family)', UBTH:'var(--cat-ubth)', BWLRota:'var(--cat-bwlrota)'};
const PRI_COLOR_VAR = {A:'var(--pri-a)', B:'var(--pri-b)', C:'var(--pri-c)', D:'var(--pri-d)'};

function getPeriodRange(period){
  const now = new Date();
  let start, end;
  if(period==='month'){
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth()+1, 1);
  } else if(period==='year'){
    start = new Date(now.getFullYear(),0,1);
    end = new Date(now.getFullYear()+1,0,1);
  } else { // week (Mon-Sun containing today)
    const day = now.getDay();
    const diffToMonday = (day===0?-6:1-day);
    start = new Date(now.getFullYear(),now.getMonth(),now.getDate()+diffToMonday);
    end = new Date(start.getFullYear(),start.getMonth(),start.getDate()+7);
  }
  return {start,end};
}

function completionColor(pct){
  if(pct===null || pct===undefined) return 'var(--steel)';
  if(pct>=91) return 'var(--comp-91)'; // includes 100% — same bright green, text turns gold separately
  if(pct>=75) return 'var(--comp-75)';
  if(pct>=50) return 'var(--comp-50)';
  if(pct>=40) return 'var(--comp-40)';
  if(pct>=20) return 'var(--comp-20)';
  return 'var(--comp-0)';
}
function pctText(pct){
  if(pct===null || pct===undefined) return '—';
  return pct>=100 ? `<span class="pct-gold">${pct}%</span>` : (pct+'%');
}

function renderVerticalBars(items, maxHeight){
  maxHeight = maxHeight || 130;
  const maxVal = Math.max(1, ...items.map(it=>it.value||0));
  let html = `<div class="vbar-chart" style="height:${maxHeight+34}px;">`;
  items.forEach(it=>{
    const h = Math.max(2, Math.round(((it.value||0)/maxVal)*maxHeight));
    html += `<div class="vbar-col">
      <div class="vbar-value">${it.displayValue!==undefined?it.displayValue:it.value}</div>
      <div class="vbar-fill" style="height:${h}px;background:${it.color};"></div>
      <div class="vbar-label">${it.axisColor?`<span class="vbar-axis-swatch" style="background:${it.axisColor};"></span>`:''}${it.label}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderDonut(pct, color, label, sublabel){
  const r=32, c=Math.round(2*Math.PI*r);
  const offset = Math.round(c - (Math.min(100,Math.max(0,pct))/100)*c);
  const textFill = pct>=100 ? 'gold' : '#e9edf0';
  const textWeight = pct>=100 ? '900' : '700';
  return `<div class="donut-wrap">
    <svg viewBox="0 0 80 80" width="88" height="88">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--bg-0)" stroke-width="9"/>
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 40 40)"/>
      <text x="40" y="45" text-anchor="middle" font-size="15" fill="${textFill}" font-family="Archivo Narrow, sans-serif" font-weight="${textWeight}">${pct}%</text>
    </svg>
    <div class="donut-label">${label}</div>
    ${sublabel?`<div class="donut-sublabel">${sublabel}</div>`:''}
  </div>`;
}

function renderCharts(){
  const panel = document.getElementById('panel-charts');
  const today0 = todayISO();

  // ---- in-time completion stats helper (per priority bucket) ----
  function inTimeStats(matchFn){
    let success=0, fail=0;
    state.archive.forEach(t=>{
      if(!matchFn(t)) return;
      if(!t.dueDate || (t.completedDate && t.completedDate<=t.dueDate)) success++; else fail++;
    });
    state.tasks.forEach(t=>{
      if(!matchFn(t)) return;
      if(t.dueDate && t.dueDate<today0) fail++; // overdue, still not done
    });
    const total = success+fail;
    return {success, fail, rate: total?Math.round(success/total*100):null};
  }

  const priStats = {};
  ['A','B','C','D'].forEach(p=>{ priStats[p] = inTimeStats(t=>t.priority===p); });

  let critTotal=0, critDone=0;
  Object.values(state.daily).forEach(d=>{
    Object.values(d.slots||{}).forEach(s=>{ if(s.critical){ critTotal++; if(s.completed) critDone++; } });
  });
  const critRate = critTotal ? Math.round(critDone/critTotal*100) : null;

  // combined completion rate across A-D + critical
  const combinedSuccess = priStats.A.success+priStats.B.success+priStats.C.success+priStats.D.success+critDone;
  const combinedTotal = priStats.A.success+priStats.A.fail+priStats.B.success+priStats.B.fail+priStats.C.success+priStats.C.fail+priStats.D.success+priStats.D.fail+critTotal;
  const combinedRate = combinedTotal ? Math.round(combinedSuccess/combinedTotal*100) : null;

  // goals completed in the last 7 days (across all weeks' data)
  let goalsCompletedLast7=0;
  const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
  const sevenAgoStr = sevenDaysAgo.toISOString().slice(0,10);
  allGoalsEverywhere().forEach(g=>{
    if(g.completed && g.completedDate && g.completedDate>=sevenAgoStr) goalsCompletedLast7++;
  });

  // average allocated time per completed task (proxy for "time taken" — see note)
  const completedWithTime = state.archive.filter(t=>typeof t.time==='number');
  const avgTime = completedWithTime.length ? Math.round(completedWithTime.reduce((s,t)=>s+t.time,0)/completedWithTime.length) : null;

  let html = `<div class="card"><h2>Overview</h2>
    <div class="donut-row">
      ${renderDonut(combinedRate===null?0:combinedRate, completionColor(combinedRate), 'Combined Completion Rate', combinedSuccess+' of '+combinedTotal)}
      <div class="donut-wrap">
        <div class="stat-box" style="min-width:110px;">
          <div class="num">${goalsCompletedLast7}</div>
          <div class="lbl">Goals Completed<br/>Last 7 Days</div>
        </div>
      </div>
      <div class="donut-wrap">
        <div class="stat-box" style="min-width:110px;">
          <div class="num">${avgTime!==null?avgTime+'m':'—'}</div>
          <div class="lbl">Avg. Allocated Time<br/>per Task</div>
        </div>
      </div>
    </div>
    <p class="assumption-note">"Completion rate" only counts a task as successful if it was finished on or before its due date — completing it late (or leaving it overdue) counts against the rate, even if it's done eventually. Average time is based on each task's allocated time estimate, since the app doesn't track actual elapsed working time.</p>
  </div>`;

  html += `<div class="card"><h2>In-Time Completion Rate by Rank</h2>`;
  const rankItems = ['A','B','C','D'].map(p=>({
    label:p, value:priStats[p].rate||0, displayValue:pctText(priStats[p].rate),
    color:completionColor(priStats[p].rate), axisColor:PRI_COLOR_VAR[p]
  }));
  rankItems.push({
    label:'CRIT', value:critRate||0, displayValue:pctText(critRate),
    color:completionColor(critRate), axisColor:'var(--amber)'
  });
  html += renderVerticalBars(rankItems);
  html += `</div>`;

  const goalPeriod = state._goalChartPeriod || 'week';
  const {start:gStart, end:gEnd} = getPeriodRange(goalPeriod);
  let goalDone=0, goalPending=0;
  allGoalsEverywhere().forEach(g=>{
    if(!g.locked) return;
    if(g.completed && g.completedDate){
      const cd = new Date(g.completedDate+'T00:00:00');
      if(cd>=gStart && cd<gEnd) goalDone++;
    } else if(!g.completed){
      goalPending++;
    }
  });
  const goalRate = (goalDone+goalPending) ? Math.round(goalDone/(goalDone+goalPending)*100) : null;
  const goalPeriodLabels = {week:'Last Week', month:'Last Month', year:'Last Year'};
  html += `<div class="card"><h2>Goal Completion Rate</h2>
    <div class="period-pill-row">
      ${['week','month','year'].map(p=>`<div class="period-pill ${goalPeriod===p?'active':''}" onclick="state._goalChartPeriod='${p}';renderCharts()">${goalPeriodLabels[p]}</div>`).join('')}
    </div>
    <div class="donut-row">
      ${renderDonut(goalRate===null?0:goalRate, completionColor(goalRate), 'Goals', goalDone+' completed')}
    </div>
  </div>`;

  const rolePeriod = state._roleChartPeriod || 'month';
  const {start:rStart, end:rEnd} = getPeriodRange(rolePeriod);
  const roleItems = CATS.map(c=>{
    let success=0, fail=0;
    state.archive.forEach(t=>{
      if(t.category!==c || !t.completedDate) return;
      const cd = new Date(t.completedDate+'T00:00:00');
      if(cd>=rStart && cd<rEnd) success++;
    });
    state.tasks.forEach(t=>{
      if(t.category!==c) return;
      if(t.dueDate && t.dueDate<today0) fail++;
    });
    const rate = (success+fail) ? Math.round(success/(success+fail)*100) : null;
    return {label:CAT_LABEL[c], value:rate||0, displayValue:pctText(rate), color:completionColor(rate), axisColor:CAT_COLOR_VAR[c]};
  });
  html += `<div class="card"><h2>Completion Rate by Role</h2>
    <div class="period-pill-row">
      <div class="period-pill ${rolePeriod==='month'?'active':''}" onclick="state._roleChartPeriod='month';renderCharts()">Last Month</div>
      <div class="period-pill ${rolePeriod==='year'?'active':''}" onclick="state._roleChartPeriod='year';renderCharts()">Last Year</div>
    </div>
    ${renderVerticalBars(roleItems)}
    <p class="assumption-note">Based on Task List completions only (weekly goals aren't counted separately here).</p>
  </div>`;

  panel.innerHTML = html;
}

/* ================= FLOATING OVERLAY ================= */
function findCurrentSlot(){
  const dateStr = todayISO();
  const d = state.daily[dateStr];
  if(!d) return null;
  const now = new Date();
  for(const q of quarters()){
    const start = new Date(dateStr+'T00:00:00'); start.setHours(q.h,q.m,0,0);
    const end = new Date(start.getTime()+15*60000);
    if(now>=start && now<end){
      let slot = d.slots[q.key];
      if(slot && slot.occupiedBy) slot = d.slots[slot.occupiedBy];
      return {slot, label:fmtHM(q.h,q.m)};
    }
  }
  return null;
}

function computeMinutesBehind(){
  const dateStr = todayISO();
  const d = state.daily[dateStr];
  if(!d) return 0;
  const now = new Date();
  let behind = 0;
  Object.keys(d.slots).forEach(key=>{
    const slot = d.slots[key];
    if(!slot || slot.occupiedBy) return; // only evaluate primary blocks once
    if(!(slot.taskId||slot.customText||slot.critical) || slot.completed) return;
    const parts = key.split('_');
    const h = parseInt(parts[0].slice(1)), m = parseInt(parts[1]);
    const start = new Date(dateStr+'T00:00:00'); start.setHours(h,m,0,0);
    const minutes = slot.span ? slot.span*15 : 15;
    const end = new Date(start.getTime()+minutes*60000);
    if(now>=end){ behind += Math.round((now-end)/60000); }
  });
  return behind;
}

function renderOverlay(){
  if(!state) return;
  const cur = findCurrentSlot();
  const behind = computeMinutesBehind();
  const doc = pipWindowRef ? pipWindowRef.document : document;
  const body = doc.getElementById('ov-body-content');
  if(!body) return;
  let taskName = 'STANDING BY';
  let meta = '';
  if(cur && cur.slot){
    if(cur.slot.critical){ taskName = cur.slot.name; meta = cur.label+' · CRITICAL'; }
    else if(cur.slot.taskId || cur.slot.customText){
      const task = cur.slot.taskId ? (state.tasks.find(t=>t.id===cur.slot.taskId) || state.archive.find(t=>t.id===cur.slot.taskId)) : null;
      taskName = task ? task.name : cur.slot.customText;
      meta = cur.label;
    } else { taskName='NO TASK ASSIGNED'; meta = cur.label; }
  } else if(cur){
    taskName = 'NO TASK ASSIGNED'; meta = cur.label;
  } else {
    meta = 'Outside scheduled hours (04:00–22:00)';
  }
  const statusHtml = behind>0
    ? `<div class="ov-behind">${behind} MIN BEHIND — CATCH UP</div>`
    : `<div class="ov-ontrack">ON SCHEDULE</div>`;
  const hazardHtml = state.pendingTomorrowPlan
    ? `<div class="ov-hazard" onclick="goPlanTomorrow()">⚠ Plan Tomorrow — Click</div>
       <button class="btn btn-crit btn-small" style="width:100%;margin-top:4px;" onclick="loadNextDayNow()">⬇ Load Next Day</button>`
    : '';
  body.innerHTML = `
    <div class="ov-row"><div class="ov-label">Current Slot</div><div class="ov-task">${escHtml(taskName)}</div>
    <div class="ov-label">${escHtml(meta)}</div></div>
    ${statusHtml}
    ${hazardHtml}
  `;
}

function toggleOverlay(){

function setupOverlayDrag(){
  const ov = document.getElementById('overlay');
  const head = document.getElementById('ov-head');
  let offX=0, offY=0;
  head.addEventListener('mousedown', e=>{
    if(e.target.closest('button')) return;
    overlayDragging = true;
    offX = e.clientX - ov.getBoundingClientRect().left;
    offY = e.clientY - ov.getBoundingClientRect().top;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!overlayDragging) return;
    ov.style.left = (e.clientX-offX)+'px';
    ov.style.top = (e.clientY-offY)+'px';
    ov.style.right='auto'; ov.style.bottom='auto';
  });
  document.addEventListener('mouseup', ()=>{ overlayDragging=false; });
}

/* Document Picture-in-Picture: a REAL always-on-top OS window,
   floats above every application, not just this browser tab.
   Chrome/Edge only (116+), and the tab must stay open. */
async function popOutOverlay(){
  if(!('documentPictureInPicture' in window)){
    showNotice("Floating Window Unsupported", "Your browser doesn't support floating always-on-top windows (Document Picture-in-Picture). This works in Chrome or Edge — and only if this file is opened directly in the browser (not previewed inside another app's sandbox).");
    return;
  }
  try{
    const pip = await documentPictureInPicture.requestWindow({width:280, height:190});
    pipWindowRef = pip;
    // copy stylesheets so it renders correctly
    [...document.styleSheets].forEach(sheet=>{
      try{
        const rules = [...sheet.cssRules].map(r=>r.cssText).join('\n');
        const style = pip.document.createElement('style');
        style.textContent = rules;
        pip.document.head.appendChild(style);
      }catch(e){ /* cross-origin sheet, skip */ }
    });
    const overlay = document.getElementById('overlay');
    pip.document.body.style.margin='0';
    pip.document.body.style.background='var(--bg-1)';
    pip.document.body.appendChild(overlay);
    overlay.style.position='static';
    overlay.style.width='100%';
    document.getElementById('pip-btn').style.display='none';
    renderOverlay();
    pip.addEventListener('pagehide', ()=>{
      document.body.appendChild(overlay);
      overlay.style.position='fixed';
      overlay.style.width='260px';
      overlay.style.bottom='18px'; overlay.style.right='18px';
      document.getElementById('pip-btn').style.display='';
      pipWindowRef = null;
      renderOverlay();
    }, {once:true});
  }catch(e){
    showNotice('Floating Window Error', 'Could not open the floating window: '+e.message);
  }
}

/* ================= 16:45 CHECK-IN REMINDER ================= */
function checkReminder(){
  const now = new Date();
  const day = now.getDay(); // 0=Sun...6=Sat
  const hh = now.getHours(), mm = now.getMinutes();
  const isWeekday = day>=1 && day<=5;
  if(isWeekday && hh===16 && mm===45 && state.lastReminderDate!==todayISO()){
    state.lastReminderDate = todayISO();
    state.pendingTomorrowPlan = true;
    saveState();
    showReminderModal();
  }
}
function showReminderModal(){
  const nextDay = getNextWeekday(new Date());
  const nextDayName = DAYS[nextDay.getDay()];
  const html = `<div class="modal-back">
    <div class="modal reminder">
      <h2>⏰ 1645 HOURS</h2>
      <p>Planning time. Review today's completed objectives, mark anything outstanding, and lay out ${nextDayName}'s schedule before stand-down.</p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-accent" onclick="closeModal();goPlanTomorrow();">Plan ${nextDayName} Now</button>
        <button class="btn" onclick="closeModal()">Later</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}
function getNextWeekday(fromDate){
  const d = new Date(fromDate);
  d.setDate(d.getDate()+1);
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
  return d;
}

function checkNextDayPlanStatus(){
  if(state.lastNextDayCheckDate === todayISO()) return; // once per day
  state.lastNextDayCheckDate = todayISO();
  saveState();
  const nextDay = getNextWeekday(new Date());
  const iso = nextDay.getFullYear()+'-'+String(nextDay.getMonth()+1).padStart(2,'0')+'-'+String(nextDay.getDate()).padStart(2,'0');
  const dObj = state.daily[iso];
  const hasRealContent = dObj && Object.values(dObj.slots||{}).some(s=>s && !s.occupiedBy && s.source!=='default');
  if(!hasRealContent){
    state.pendingTomorrowPlan = true;
    saveState();
    showNextDayPlanPrompt(nextDay);
  }
}
function showNextDayPlanPrompt(nextDay){
  const dayName = DAYS[nextDay.getDay()];
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal reminder">
      <h2>📆 No Plan for ${dayName}</h2>
      <p>You haven't planned ${dayName} yet. Want to do it now?</p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-accent" onclick="closeModal();goPlanTomorrow();">Plan Now</button>
        <button class="btn btn-ghost" onclick="closeModal()">Defer for Now</button>
      </div>
    </div>
  </div>`;
}

function goPlanTomorrow(){
  const t = getNextWeekday(new Date());
  const iso = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  state.pendingTomorrowPlan = false;
  // force a fresh pull of Outlook + Weekly Schedule data every time this is used, even if that date was visited before
  const dObj = ensureDaily(iso);
  dObj.outlookSynced = false;
  dObj.weeklyGoalsInjected = false;
  saveState();
  window._showLoadingForNextSync = true;
  showLoadingProgressModal('📅 Loading Next Working Day');
  goToDailyDate(iso);
  renderOverlay();
}

function tomorrowISO(){
  const t = new Date(); t.setDate(t.getDate()+1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}

function loadNextDayNow(){
  const iso = tomorrowISO();
  const dayIdx = new Date(iso+'T00:00:00').getDay();
  switchTab('daily');
  state.pendingTomorrowPlan = false;
  saveState();
  setTimeout(()=>{
    const el = document.getElementById('daily-date-picker');
    if(el){ el.value = iso; }
    const d = ensureDaily(iso);
    seedDailyDefaults(iso);
    injectWeeklyGoals(iso, dayIdx);
    d.outlookSynced = true;
    syncOutlook(iso, {silent:false});
    renderDaily();
  }, 0);
  renderOverlay();
}

/* ================= WEEKLY PLANNING REMINDER =================
   NOTE: a static browser file cannot send real email in the background —
   there is no server component here. This is a best-effort in-app nudge
   that only fires while the app is open on Friday/Saturday evening, and
   offers a pre-filled mailto: link (opens your own mail client) rather
   than genuinely automatic delivery. For guaranteed delivery even when
   this tab is closed, a real scheduled automation (e.g. Zapier/Make, or
   a calendar reminder) would be needed instead. */
function checkWeeklyPlanReminder(){
  const now = new Date();
  const day = now.getDay();
  const nowTime = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  (state.settings.reminders||[]).forEach(r=>{
    if(r.day===day && r.time===nowTime){
      const fireKey = r.day+'_'+r.time+'_'+todayISO();
      if(state.lastWeeklyReminderDate===fireKey) return;
      state.lastWeeklyReminderDate = fireKey;
      saveState();
      showWeeklyPlanReminderModal();
    }
  });
}
function showWeeklyPlanReminderModal(){
  const subject = encodeURIComponent('Weekly Schedule Planning Reminder');
  const body = encodeURIComponent("Reminder to plan next week's Weekly Schedule in the MAXA Ops Scheduler.");
  const mailto = `mailto:${state.settings.email}?subject=${subject}&body=${body}`;
  document.getElementById('modal-root').innerHTML = `<div class="modal-back">
    <div class="modal reminder">
      <h2>📆 Plan Next Week</h2>
      <p>Time to plan next week's Weekly Schedule. This app can't send background emails on its own, but you can open a reminder email now, or just jump straight in.</p>
      <div class="modal-actions" style="justify-content:center;flex-wrap:wrap;">
        <a class="btn btn-accent" href="${mailto}" onclick="closeModal()">✉ Email Myself</a>

        <button class="btn btn-ghost" onclick="closeModal()">Dismiss</button>
      </div>
    </div>

}

/* ================= MISSED TASK CARRYOVER ================= */
function checkMissedTasksCarryover(){
  if(state.lastCarryoverCheckDate === todayISO()) return false;
  state.lastCarryoverCheckDate = todayISO();
  saveState();
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  const yDaily = state.daily[yStr];
  if(!yDaily) return false;
  const missed = [];
  Object.keys(yDaily.slots).forEach(k=>{
    const s = yDaily.slots[k];
    if(!s || s.occupiedBy) return;
    if(s.source==='default') return;
    if(!(s.taskId||s.customText||s.critical)) return;
    if(s.completed) return;
    missed.push(s);
  });
  if(missed.length===0) return false;
  window._missedTasks = missed;
  showMissedTasksModal(missed);
  return true;
}

function missedTaskName(s){
  if(s.critical) return s.name;
  if(s.taskId){ const t = state.tasks.find(x=>x.id===s.taskId) || state.archive.find(x=>x.id===s.taskId); return t ? t.name : '(task removed)'; }
  return s.customText || 'item';
}

function showMissedTasksModal(missed){
  let html = `<div class="modal-back">
    <div class="modal">
      <h2>⚠ Missed Yesterday</h2>
      <p>These weren't marked complete yesterday. Reallocate into today's plan? Higher-priority items get first pick of the open slots.</p>
      <div class="suggest-list">`;
  missed.forEach(s=>{
    html += `<div class="flag-item"><div><div class="fname">${escHtml(missedTaskName(s))}</div></div></div>`;
  });
  html += `</div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-small" onclick="closeModal()">Dismiss</button>
        <button class="btn btn-accent btn-small" onclick="reallocateMissedTasks()">Reallocate to Today</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML = html;
}

function reallocateMissedTasks(){
  const missed = window._missedTasks || [];
  const todayStr = todayISO();
  const d = ensureDaily(todayStr);
  const rank = {A:0,B:1,C:2,D:3};
  const withPriority = missed.map(s=>{
    let pri = 'D';
    if(s.critical) pri = 'A';
    else if(s.taskId){ const t = state.tasks.find(x=>x.id===s.taskId); if(t) pri = computePriority(t); }
    return {s, pri};
  });
  withPriority.sort((a,b)=> rank[a.pri]-rank[b.pri]);
  const allQ = quarters();
  let placedCount=0; const failedNames=[];
  withPriority.forEach(({s})=>{
    const minutes = (s.span||1)*15;
    const needed = Math.max(1, Math.round(minutes/15));
    let placed = false;
    for(let i=0;i<allQ.length && !placed;i++){
      let ok = true;
      for(let j=0;j<needed;j++){
        const idx = i+j;
        if(idx>=allQ.length || d.slots[allQ[idx].key]){ ok=false; break; }
      }
      if(ok){
        const data = s.critical ? {critical:true, name:s.name, time:minutes} : (s.taskId ? {taskId:s.taskId} : {customText:s.customText});
        writeSpanBlock(todayStr, allQ[i].key, minutes, data);
        placed = true; placedCount++;
      }
    }
    if(!placed) failedNames.push(missedTaskName(s));
  });
  saveState(); closeModal(); renderAll();
  if(failedNames.length){
    showNotice('Partially Reallocated', placedCount+' item(s) placed. No room today for: '+failedNames.join(', ')+'. Please place these manually.');
  } else {
    showNotice('Reallocated', placedCount+' missed item(s) added to today.');
  }
}

/* ================= helpers ================= */
function escHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escAttr(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/"/g,'&quot;');
}
function escJs(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
}

  await loadState();
  applyStoredTheme();
  switchTab(state.tabOrder[0]);
  setupOverlayDrag();
  const showedMissedModal = checkMissedTasksCarryover();
  if(!showedMissedModal) checkNextDayPlanStatus();
  setInterval(()=>{ renderClock(); renderOverlay(); checkReminder(); checkWeeklyPlanReminder(); }, 15000);
  renderClock(); renderOverlay(); checkReminder(); checkWeeklyPlanReminder();
}
document.addEventListener('DOMContentLoaded', init);
